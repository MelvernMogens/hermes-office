name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: cp plugin.js /tmp/plugin.mjs && node --check /tmp/plugin.mjs
      - name: Desktop loader import scan
        run: node test/check_imports.cjs plugin.js
      - name: Core patch script
        run: bash -n core-patch/reapply.sh
