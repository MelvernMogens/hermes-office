{

/* fake registration ctx */
const captured = { registrations: [], i18nBundles: null, dispose: null };
const fakeCtx = {
  register(entry) {
    captured.registrations.push(entry);
    return () => { const i = captured.registrations.indexOf(entry); if (i >= 0) captured.registrations.splice(i, 1); };
  },

/* ------- controls ------- */
function bindGroup(sel, attr, fn) {
